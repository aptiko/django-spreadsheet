name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: [">=4.2,<5", ">=5.2,<6"]
        include:
          - python-version: "3.14"
            django-version: ">=5.2,<6"
            include-codecov: true

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Create and activate venv
      run: |
        python -m venv ~/.venv
        source ~/.venv/bin/activate
        pip install -U pip 'setuptools>=61'

    - uses: actions/checkout@v6

    - name: Install Dependencies
      run: |
        source ~/.venv/bin/activate
        pip install coverage isort flake8 'black<27' twine setuptools build
        pip install "django${{ matrix.django-version }}"
        pip install -e .

    - name: Run Tests
      run: |
        source ~/.venv/bin/activate
        black --check django_spreadsheet tests
        flake8 --max-line-length=88 django_spreadsheet tests
        isort --check-only --diff --profile=black django_spreadsheet tests
        python -m build
        twine check dist/*
        coverage run --source=django_spreadsheet --omit="*/_version.py" -m unittest -v
        coverage json

    - name: Upload coverage to Codecov
      if: matrix.include-codecov == true
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
